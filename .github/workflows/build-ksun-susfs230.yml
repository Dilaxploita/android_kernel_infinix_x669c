name: Build Kernel X669C

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: 'Enable KernelSU Next (KSUN)'
        required: true
        type: boolean
        default: true
      susfs:
        description: 'Enable SUSFS (Kernel 4.19)'
        required: true
        type: boolean
        default: true
      include_dtb:
        description: 'Include mtk.dtb in AnyKernel3 ZIP'
        required: true
        type: boolean
        default: false

jobs:
  build-kernel:
    name: Build X669C | KSUN:${{ github.event.inputs.ksu }} | SUSFS:${{ github.event.inputs.susfs }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf libncurses-dev libssl-dev libxml2 libxml2-utils \
            lzop rsync schedtool zip zlib1g-dev python3 wget \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-x669c-ccache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-x669c-ccache-

      - name: Setup ZyC-Clang 16 Toolchain
        run: |
          mkdir -p $HOME/zyc-clang
          cd $HOME/zyc-clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz || \
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20240504-release/Clang-16.0.6-20240504.tar.gz
          tar -zxf Clang-*.tar.gz
          rm -f Clang-*.tar.gz

      - name: Setup KernelSU Next & SUSFS
        run: |
          if [ "${{ github.event.inputs.ksu }}" == "true" ]; then
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash
            ./scripts/config --file arch/arm64/configs/x669c_defconfig \
              -e CONFIG_KSU \
              -d CONFIG_KPROBES \
              -d CONFIG_HAVE_KPROBES \
              -d CONFIG_KRETPROBES
          fi

          if [ "${{ github.event.inputs.susfs }}" == "true" ]; then
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu || \
            git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu

            cp -r ../susfs4ksu/kernel_patches/fs/* fs/
            cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

            patch -p1 --fuzz=3 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

            if [ -d "KernelSU-Next" ] && [ -f "../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
              cd KernelSU-Next
              patch -p1 --fuzz=3 --forward < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
              cd ..
            fi

            grep -q "susfs.o" fs/Makefile || echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile

            python3 -c '
          with open("fs/open.c", "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()
          new_lines = []
          skip = False
          injected = False
          for line in lines:
              if not injected and line.startswith("#include <linux/fs.h>"):
                  new_lines.append(line)
                  new_lines.append("#ifdef CONFIG_KSU\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n")
                  injected = True
                  continue
              if "fname = getname_flags(filename, lookup_flags, NULL);" in line:
                  skip = True
                  new_lines.append("#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\tres = user_path_at(dfd, filename, lookup_flags, &path);\n")
                  continue
              if skip:
                  if "res = filename_lookup(dfd, fname, lookup_flags, &path, NULL);" in line:
                      skip = False
                  continue
              new_lines.append(line)
          with open("fs/open.c", "w", encoding="utf-8") as f:
              f.writelines(new_lines)
          print("fs/open.c fixed")
          '

            ./scripts/config --file arch/arm64/configs/x669c_defconfig \
              -e CONFIG_KSU_SUSFS \
              -e CONFIG_KSU_SUSFS_SUS_PATH \
              -e CONFIG_KSU_SUSFS_SUS_MOUNT \
              -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
              -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              -e CONFIG_KSU_SUSFS_SUS_KSTAT \
              -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
              -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
              -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
              -e CONFIG_KSU_SUSFS_ENABLE_LOG \
              -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
              -e CONFIG_KSU_SUSFS_SUS_SU
          fi

      - name: Compatibility Fixes & Compile Kernel
        run: |
          grep -q "stpcpy" lib/string.c || printf '\nchar *stpcpy(char *__restrict__ dest, const char *__restrict__ src)\n{\n\twhile ((*dest++ = *src++) != '\''\\0'\'')\n\t\t;\n\treturn --dest;\n}\nEXPORT_SYMBOL(stpcpy);\n' >> lib/string.c

          grep -q "STRUCT_ALIGN();" include/asm-generic/vmlinux.lds.h || \
          sed -i 's/\.builtin_fw        : AT(ADDR(\.builtin_fw) - LOAD_OFFSET) {/\.builtin_fw        : AT(ADDR(\.builtin_fw) - LOAD_OFFSET) { STRUCT_ALIGN();/g' include/asm-generic/vmlinux.lds.h

          sed -i 's/-Werror//g' mm/Makefile

          export PATH="$HOME/zyc-clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Rootzone"
          export KBUILD_BUILD_HOST="Infinix-X669C"

          make O=out ARCH=arm64 x669c_defconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
               CC="ccache clang -Wno-error -Wno-strict-prototypes -Wno-deprecated-non-prototype --target=aarch64-linux-gnu -fno-integrated-as -Wno-error --prefix=/usr/bin/aarch64-linux-gnu-" \
               LD=aarch64-linux-gnu-ld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               Image.gz

      - name: Package & Upload Flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/

          if [ "${{ github.event.inputs.include_dtb }}" == "true" ] && [ -f "out/arch/arm64/boot/mtk.dtb" ]; then
            cp out/arch/arm64/boot/mtk.dtb AnyKernel3/dtb
          fi

          printf "properties() { '\nkernel.string=Rootzone Kernel KSUN+SUSFS - Infinix Hot 30i (X669C)\ndo.devicecheck=0\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=X669C\ndevice.name2=Infinix-X669C\ndevice.name3=mt6765\nsupported.versions=\nsupported.patchlevels=\n'; }\n\nblock=/dev/block/by-name/boot;\nis_slot_device=0;\nramdisk_compression=auto;\npatch_vbmeta_flag=auto;\n\n. tools/ak3-core.sh;\n\nset_perm_recursive 0 0 755 644 \$ramdisk/*;\nset_perm_recursive 0 0 750 750 \$ramdisk/init* \$ramdisk/sbin;\n\ndump_boot;\nwrite_boot;\n" > AnyKernel3/anykernel.sh

          cd AnyKernel3
          DATE=$(date +"%Y%m%d-%H%M")
          zip -r9 ../RootzoneKernel-X669C-${DATE}.zip * -x .git README.md *placeholder

      - name: Upload Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RootzoneKernel-X669C-${{ github.run_id }}
          path: RootzoneKernel-X669C-*.zip
          compression-level: 0
