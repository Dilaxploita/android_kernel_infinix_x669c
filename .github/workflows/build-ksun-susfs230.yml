name: Build Rootzone Kernel (KSUN + SUSFS) - X669C

on:
  workflow_dispatch:
    inputs:
      include_dtb:
        description: 'Sertakan mtk.dtb ke dalam ZIP AnyKernel3'
        required: true
        default: false
        type: boolean

jobs:
  build-kernel:
    name: Compile X669C (4.19 + KSUN + SUSFS)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git \
            libncurses5-dev libssl-dev libxml2 lzop python3 unzip zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi wget

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/clang
          rm -f clang.tar.gz

      - name: Setup KernelSU Next (KSUN)
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          ./scripts/config --file arch/arm64/configs/x669c_defconfig \
            -e CONFIG_KSU \
            -d CONFIG_KPROBES \
            -d CONFIG_HAVE_KPROBES \
            -d CONFIG_KRETPROBES

      - name: Setup SUSFS (Kernel 4.19 Compatible)
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu || \
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git -b kernel-4.19 ../susfs4ksu

          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          patch -p1 --fuzz=3 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

          if [ -d "KernelSU-Next" ] && [ -f "../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            cd KernelSU-Next
            patch -p1 --fuzz=3 --forward < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch || true
            cd ..
          fi

          grep -q "susfs.o" fs/Makefile || echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile

          # Perbaiki fs/open.c jika patch SUSFS menyisipkan blok fname / ksu_su_compat_enabled
          python3 - << 'PYEOF'
          with open("fs/open.c", "r", encoding="utf-8", errors="ignore") as f:
              lines = f.readlines()

          new_lines = []
          skip = False
          injected_header = False

          for line in lines:
              if not injected_header and line.startswith("#include <linux/fs.h>"):
                  new_lines.append(line)
                  new_lines.append('#include "internal.h"\n')
                  new_lines.append('#ifdef CONFIG_KSU\n')
                  new_lines.append('extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n')
                  new_lines.append('#endif\n')
                  injected_header = True
                  continue

              if "fname = getname_flags(filename, lookup_flags, NULL);" in line:
                  skip = True
                  new_lines.append("#ifdef CONFIG_KSU\n")
                  new_lines.append("\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n")
                  new_lines.append("#endif\n")
                  new_lines.append("\tres = user_path_at(dfd, filename, lookup_flags, &path);\n")
                  continue

              if skip:
                  if "res = filename_lookup(dfd, fname, lookup_flags, &path, NULL);" in line:
                      skip = False
                  continue

              new_lines.append(line)

          with open("fs/open.c", "w", encoding="utf-8") as f:
              f.writelines(new_lines)
          print("fs/open.c patched cleanly for X669C 4.19.")
          PYEOF

          ./scripts/config --file arch/arm64/configs/x669c_defconfig \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_SU

      - name: Apply MT6765 & Clang Compatibility Fixes
        run: |
          grep -q "stpcpy" lib/string.c || cat << 'STPEOF' >> lib/string.c

          char *stpcpy(char *__restrict__ dest, const char *__restrict__ src)
          {
                  while ((*dest++ = *src++) != '\0')
                          /* nothing */;
                  return --dest;
          }
          EXPORT_SYMBOL(stpcpy);
          STPEOF

          grep -q "STRUCT_ALIGN();" include/asm-generic/vmlinux.lds.h || \
          sed -i 's/\.builtin_fw        : AT(ADDR(\.builtin_fw) - LOAD_OFFSET) {/\.builtin_fw        : AT(ADDR(\.builtin_fw) - LOAD_OFFSET) { STRUCT_ALIGN();/g' include/asm-generic/vmlinux.lds.h

          sed -i 's/-Werror//g' mm/Makefile

      - name: Build Kernel Image.gz
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Rootzone"
          export KBUILD_BUILD_HOST="Infinix-X669C"

          make O=out ARCH=arm64 x669c_defconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
               CC="clang --target=aarch64-linux-gnu -fno-integrated-as -Wno-error -Wno-unused-but-set-variable --prefix=/usr/bin/aarch64-linux-gnu-" \
               LD=aarch64-linux-gnu-ld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               KCFLAGS="-Wno-error -Wno-unused-but-set-variable -Wno-misleading-indentation -Wno-unused-variable -Wno-sometimes-uninitialized -Wno-fortify-source" \
               Image.gz

      - name: Package AnyKernel3 Flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/

          if [ "${{ github.event.inputs.include_dtb }}" == "true" ] && [ -f "out/arch/arm64/boot/mtk.dtb" ]; then
            cp out/arch/arm64/boot/mtk.dtb AnyKernel3/dtb
          fi

          cat << 'AKEOF' > AnyKernel3/anykernel.sh
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Rootzone Kernel KSUN + SUSFS - Infinix Hot 30i (X669C)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=X669C
          device.name2=Infinix-X669C
          device.name3=mt6765
          supported.versions=
          supported.patchlevels=
          '; }

          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          set_perm_recursive 0 0 755 644 $ramdisk/*;
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;

          dump_boot;
          write_boot;
          AKEOF

          cd AnyKernel3
          DATE=$(date +"%Y%m%d-%H%M")
          zip -r9 ../Kernel-X669C-KSUN-SUSFS-${DATE}.zip * -x .git README.md *placeholder

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-X669C-KSUN-SUSFS
          path: Kernel-X669C-KSUN-SUSFS-*.zip
          retention-days: 14
